name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # omp loads this extension under Bun, and src/project-root.ts depends on
  # node:fs symlink semantics that Bun reimplements. A green Node suite says
  # nothing about the runtime users actually get.
  #
  # `--bun` is load-bearing, not decoration: plain `bun run test` executes the
  # vitest binary through its `#!/usr/bin/env node` shebang, so every worker —
  # and therefore every assertion — runs under Node and this job proves
  # nothing. Measured, see evidence/runtime-matrix.md. `typecheck` is not
  # repeated here because tsc's verdict does not depend on the runtime.
  bun:
    name: bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install
      - run: bun run --bun test

  # Proves the install command the README documents actually resolves on a clean
  # machine, that the installed tree exposes a loadable extension entry — the
  # same thing omp's plugin installer validates before enabling a plugin — and
  # that the tree carries the baseline policy the README points a reader at,
  # still loading clean through the extension's own loader.
  #
  # Not a pull-request job: it installs by ref, and a pull request's merge ref
  # does not exist on the remote as an installable ref. It therefore runs on
  # manual dispatch (any branch) and on pushes, which includes the tag push that
  # publishes a release — so the documented command is verified against the
  # exact ref users will type. It is deliberately absent from `ci`'s needs: a
  # skipped job would otherwise fail the required check on every pull request.
  install-check:
    name: install check
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install the documented git spec into a scratch project
        env:
          SPEC: github:${{ github.repository }}#${{ github.ref_name }}
        run: |
          set -eu
          work="$(mktemp -d)"
          cd "$work"
          printf '{"name":"install-check","private":true}\n' > package.json
          echo "installing $SPEC"
          bun add "$SPEC"
          cat > check.ts <<'TS'
          import { copyFileSync, existsSync, mkdirSync, mkdtempSync, readFileSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";

          /**
           * The slice of the installed `src/config.ts` this check uses, described
           * structurally: the module is imported from the installed tree, so there is
           * nothing here for tsc to check it against.
           */
          interface LoadedSample {
            readonly warnings: readonly string[];
            readonly permissions:
              | {
                  readonly tools: Record<
                    string,
                    {
                      readonly always_allow: readonly unknown[];
                      readonly always_confirm: readonly unknown[];
                      readonly always_deny: readonly unknown[];
                      readonly invalidPatterns: readonly { readonly pattern: string }[];
                    }
                  >;
                }
              | undefined;
          }
          type LoadPermissions = (
            projectRoot: string,
            env: NodeJS.ProcessEnv,
            parse: (text: string) => unknown,
          ) => LoadedSample;

          const manifestPath = "node_modules/omp-toolgate/package.json";
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          const entries: string[] = manifest.omp?.extensions ?? [];
          if (entries.length === 0) {
            throw new Error("installed manifest declares no omp.extensions");
          }
          for (const entry of entries) {
            const resolved = new URL(
              `node_modules/omp-toolgate/${entry.replace(/^\.\//, "")}`,
              `file://${process.cwd()}/`,
            );
            const module = await import(resolved.href);
            if (typeof module.default !== "function") {
              throw new Error(`${entry} does not default-export an extension factory`);
            }
            console.log(`ok ${entry} -> ${module.default.name}`);
          }

          // The README tells a reader to copy the baseline policy to their global
          // configuration path, so a reader who has already installed the plugin must
          // find it in the tree they installed. A packaging change can drop a file
          // without changing it, which is why this is asserted about the artifact.
          const sample = "samples/tool-permissions.json";
          const samplePath = `node_modules/omp-toolgate/${sample}`;
          if (!existsSync(samplePath)) {
            throw new Error(`the installed tree does not contain ${samplePath}`);
          }

          // Loaded the way the shipped extension loads it: through its own loader, with
          // the parser src/index.ts prefers under Bun, from the global path a reader
          // would copy it to.
          const parse = (Bun as unknown as { JSON5?: { parse?: (text: string) => unknown } })
            .JSON5?.parse;
          if (typeof parse !== "function") {
            throw new Error("Bun.JSON5.parse is unavailable, so the shipped parser is untested");
          }
          const configUrl = new URL(
            "node_modules/omp-toolgate/src/config.ts",
            `file://${process.cwd()}/`,
          );
          const { loadPermissions } = (await import(configUrl.href)) as {
            loadPermissions: LoadPermissions;
          };

          const base = mkdtempSync(join(tmpdir(), "toolgate-install-check-"));
          const home = join(base, "home");
          const projectRoot = join(base, "project");
          mkdirSync(join(home, ".omp", "agent"), { recursive: true });
          mkdirSync(projectRoot, { recursive: true });
          copyFileSync(samplePath, join(home, ".omp", "agent", "tool-permissions.json"));

          const loaded = loadPermissions(projectRoot, { HOME: home }, parse);
          if (loaded.warnings.length > 0) {
            throw new Error(`${sample} loaded with warnings: ${JSON.stringify(loaded.warnings)}`);
          }
          const permissions = loaded.permissions;
          if (permissions === undefined) {
            throw new Error(`${sample} was read but did not produce a permission set`);
          }
          // A document the loader can read but that declares nothing yields an empty
          // permission set with no warning — deliberate, since it keeps an empty
          // configuration writable, and indistinguishable here from a policy that was
          // replaced by something inert. So substance is asked for twice: at least one
          // tool, and at least one compiled rule across all of them. A tool may
          // legitimately carry only a `default` — the sample's `computer` does — so the
          // rule count is taken over the whole policy rather than per tool.
          const tools = Object.keys(permissions.tools);
          if (tools.length === 0) {
            throw new Error(`${sample} loaded but declares no tools`);
          }
          const rules = Object.values(permissions.tools).reduce(
            (total, tool) =>
              total +
              tool.always_allow.length +
              tool.always_confirm.length +
              tool.always_deny.length,
            0,
          );
          if (rules === 0) {
            throw new Error(`${sample} compiled no rules for its ${tools.length} tools`);
          }
          const invalid = Object.entries(permissions.tools).flatMap(([tool, entry]) =>
            entry.invalidPatterns.map((pattern) => `${tool}: ${pattern.pattern}`),
          );
          if (invalid.length > 0) {
            throw new Error(`${sample} holds patterns that do not compile: ${invalid.join(", ")}`);
          }
          console.log(
            `ok ${sample} -> ${tools.length} tools, ${rules} rules, no warnings: ${tools.join(", ")}`,
          );
          console.log(`installed omp-toolgate ${manifest.version} with license ${manifest.license}`);
          TS
          bun check.ts

  # The single check name branch protection requires. Runtime jobs are never
  # named there, so changing the matrix never means editing the ruleset.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [node, bun]
    if: always()
    steps:
      - name: Require every runtime job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -eu
          echo "runtime results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a runtime job did not succeed ($RESULTS)"
              exit 1
            fi
          done

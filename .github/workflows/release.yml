name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag is a claim about four things. Publish only if all four agree.
  version-gate:
    name: version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, manifest and catalog must name one version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          manifest="$(jq -r '.version' package.json)"
          catalog="$(jq -r '.plugins[0].version' .omp-plugin/marketplace.json)"
          catalog_ref="$(jq -r '.plugins[0].source.ref' .omp-plugin/marketplace.json)"
          printf 'tag=%s\nmanifest=%s\ncatalog=%s\ncatalog_ref=%s\n' \
            "$TAG" "$manifest" "$catalog" "$catalog_ref"
          fail=0
          if [ "$manifest" != "$version" ]; then
            echo "::error::package.json version $manifest does not match tag $TAG"
            fail=1
          fi
          if [ "$catalog" != "$version" ]; then
            echo "::error::catalog plugin version $catalog does not match tag $TAG"
            fail=1
          fi
          if [ "$catalog_ref" != "$TAG" ]; then
            echo "::error::catalog source.ref $catalog_ref does not match tag $TAG"
            fail=1
          fi
          exit "$fail"

  # The same gate a pull request passes, not a copy of it.
  checks:
    name: checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [version-gate, checks]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
